name: ci

# CI runs by hand only (Actions > ci > Run workflow). It builds the wheel and runs the tests
# described in the README ("Building", "Tests").
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job: every job pays the runner's start.
  ci:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The native files of the stintmate-ipc release this version wraps, hash-checked.
      - name: Fetch the native files
        shell: pwsh
        run: scripts/fetch-native.ps1
      - name: Build the wheel
        shell: pwsh
        env:
          STINTMATE_IPC_PREBUILT: ${{ github.workspace }}\.native
        run: uv build --wheel
      - name: Tests
        shell: pwsh
        env:
          STINTMATE_IPC_PREBUILT: ${{ github.workspace }}\.native
        run: uv run pytest -q
